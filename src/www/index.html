<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c17">
<title>PlayKaraoke</title>
<style>
  :root {
    --bg: #0f0c17; --panel: #1c1726; --panel-2: #2e2340; --line: #2a2436;
    --text: #fff; --text-2: #b4adc2; --text-3: #7d7590;
    --brand: #b000e0; --brand-2: #5a12f0; --danger: #ff5c7a; --ok: #3ddc97;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  .logo svg { display: block; height: 38px; width: auto; }
  .welcome .logo svg { height: 92px; margin: 0 auto; }
  .who { color: var(--text-2); font-size: 14px; background: none; border: 0; padding: 6px 0; }
  .who b { color: var(--text); }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 22px 0 10px; }
  .card { background: var(--panel); border-radius: 18px; padding: 16px; }
  .hidden { display: none !important; }
  input[type=search], input[type=text] { width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; }
  input:focus { border-color: var(--brand); }
  .row-search { display: flex; gap: 8px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 16px;
    background: var(--brand); color: #fff; }
  .btn.ghost { background: var(--panel-2); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: .5; }
  .chips { display: flex; gap: 8px; margin: 12px 0 4px; }
  .chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px;
    color: var(--text-2); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .a { color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--text-2); flex-shrink: 0; }
  .tag.mine { background: var(--brand); color: #fff; }
  .muted { color: var(--text-3); font-size: 14px; }
  .big { font-size: 26px; font-weight: 800; margin: 4px 0; }
  .hero { background: linear-gradient(135deg, var(--brand-2), var(--brand)); border-radius: 22px; padding: 20px; }
  .hero .muted { color: #f1dcff; }
  .pitch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .pitch .val { font-size: 22px; font-weight: 800; min-width: 92px; text-align: center; }
  .pitch button { width: 64px; height: 56px; border-radius: 16px; border: 0; background: rgba(255,255,255,.18);
    font-size: 28px; font-weight: 800; color: #fff; }
  .mini { border: 0; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .mini.x { color: var(--danger); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(15,12,23,.96);
    border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 12px 6px; border-radius: 14px; font-weight: 700;
    color: var(--text-3); font-size: 15px; }
  .tabs button.on { background: var(--panel-2); color: #fff; }
  .badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--brand);
    color: #fff; font-size: 12px; margin-left: 4px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--panel-2); border-radius: 14px; padding: 14px 16px; font-weight: 600; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: opacity .2s; }
  .toast.err { background: var(--danger); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--panel); border-radius: 22px 22px 0 0; padding: 22px 18px
    calc(22px + env(safe-area-inset-bottom)); }
  .sheet .actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet .actions .btn { flex: 1; }
  .center { text-align: center; }
  .welcome { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .langs { display: flex; gap: 6px; }
  .langs button { border: 2px solid transparent; background: var(--panel); border-radius: 10px; font-size: 20px;
    line-height: 1; padding: 5px 7px; }
  .langs button.on { border-color: var(--brand); }
  .welcome .langs { justify-content: center; }
  .offline { background: var(--danger); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px;
    margin-top: 6px; }
</style>
</head>
<body>

<!-- Entrada: nome (uma vez, guardado no celular) -->
<section id="welcome" class="welcome hidden">
  <div class="langs"><button data-lang="en" aria-label="English">🇺🇸</button><button data-lang="pt" aria-label="Português">🇧🇷</button></div>
  <div class="logo" role="img" aria-label="PlayKaraoke"></div>
  <p class="center muted" data-i18n="tagline"></p>
  <input id="name-input" type="text" maxlength="40" data-i18n-ph="namePh" autocomplete="nickname">
  <button id="name-ok" class="btn" data-i18n="enter"></button>
</section>

<main id="app" class="hidden">
  <header>
    <div class="logo" role="img" aria-label="PlayKaraoke"></div>
    <div class="langs"><button data-lang="en" aria-label="English">🇺🇸</button><button data-lang="pt" aria-label="Português">🇧🇷</button></div>
  </header>
  <button id="who" class="who"></button>
  <div id="offline" class="offline hidden" data-i18n="offline"></div>

  <!-- Sua vez de cantar -->
  <section id="singing" class="hero hidden">
    <div class="muted" data-i18n="yourTurnNow"></div>
    <div id="singing-title" class="big"></div>
    <div id="singing-artist" class="muted"></div>
    <div class="pitch">
      <button data-pitch="-1" aria-label="Baixar o tom">−</button>
      <div><div class="muted center" data-i18n="key"></div><div id="singing-pitch" class="val"></div></div>
      <button data-pitch="1" aria-label="Subir o tom">+</button>
    </div>
    <div class="pitch">
      <button id="pitch-reset" class="btn ghost" style="flex:1;width:auto;font-size:16px" data-i18n="keyOriginal"></button>
      <button id="finish" class="btn danger" style="flex:1;width:auto;font-size:16px" data-i18n="finish"></button>
    </div>
  </section>

  <!-- Aba: buscar -->
  <section id="tab-search">
    <h2 data-i18n="searchTitle"></h2>
    <form id="search-form" class="row-search">
      <input id="q" type="search" data-i18n-ph="searchPh" enterkeyhint="search" autocomplete="off">
      <button class="btn" data-i18n="searchBtn"></button>
    </form>
    <div class="chips">
      <button class="chip on" data-src="usb" data-i18n="srcUsb"></button>
      <button class="chip" data-src="yt">YouTube</button>
    </div>
    <div id="filters" class="chips">
      <button class="chip on" data-filter="0" data-i18n="fAll"></button>
      <button class="chip" data-filter="1" data-i18n="fCdg"></button>
      <button class="chip" data-filter="2" data-i18n="fMp4"></button>
    </div>
    <p id="search-msg" class="muted"></p>
    <ul id="results" class="list"></ul>
  </section>

  <!-- Aba: minha vez -->
  <section id="tab-mine" class="hidden">
    <div id="turn" class="card" style="margin-top:16px"></div>
    <h2 data-i18n="mySongs"></h2>
    <ul id="mine" class="list card"></ul>
    <h2 data-i18n="rotation"></h2>
    <ul id="rotation" class="list card"></ul>
  </section>

  <nav class="tabs">
    <button id="tab-btn-search" class="on"><span data-i18n="tabSearch"></span></button>
    <button id="tab-btn-mine"><span data-i18n="tabMine"></span> <span id="mine-count" class="badge hidden"></span></button>
  </nav>
</main>

<div id="toast" class="toast hidden"></div>
<div id="sheet" class="sheet-bg hidden"><div class="sheet">
  <div class="muted" data-i18n="confirmAsk"></div>
  <div id="sheet-title" class="big"></div>
  <div id="sheet-artist" class="muted"></div>
  <div class="actions">
    <button id="sheet-cancel" class="btn ghost" data-i18n="cancel"></button>
    <button id="sheet-ok" class="btn" data-i18n="request"></button>
  </div>
</div></div>

</svg></template>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

/* Logo da PlayKaraoke (SVG branco) nos lugares marcados com .logo. */
document.querySelectorAll('.logo').forEach((el) => el.append($('logo-svg').content.cloneNode(true)));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* Identidade do celular (aleatória, guardada) e o nome do cantor. */
let client = store.get('pk_client');
if (!client) {
  client = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  store.set('pk_client', client);
}
let myName = store.get('pk_name') || '';

/* Link com ?name= (e ?client=, para demonstração) já entra com esse nome. */
const params = new URLSearchParams(location.search);
if (params.get('client')) { client = params.get('client'); store.set('pk_client', client); }
if (params.get('name')) { myName = params.get('name').slice(0, 40); store.set('pk_name', myName); }

/* Mesmo hash do PS5 (FNV-1a), para achar "eu" no estado público. */
function tagOf(text) {
  let h = 2166136261;
  for (const b of new TextEncoder().encode(text)) { h ^= b; h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
const myTag = tagOf(client);

/* ---------- Idioma ---------- */

const I18N = {
  en: {
    tagline: 'Request songs to sing on the TV.', namePh: 'Your name', enter: 'Enter',
    offline: 'No connection to the PS5. Retrying…', yourTurnNow: "It's your turn! Singing now",
    key: 'Key', original: 'Original', keyOriginal: 'Original key', finish: 'Finish',
    searchTitle: 'Search songs', searchPh: 'Artist, song or code', searchBtn: 'Search',
    fAll: 'All', fCdg: 'CDG only', fMp4: 'Video only (MP4)', srcUsb: 'USB drive',
    ytNote: 'YouTube videos play in the PS5 web browser.', mySongs: 'My songs', rotation: 'Rotation',
    tabSearch: 'Search', tabMine: 'My turn', confirmAsk: 'Request this song?', cancel: 'Cancel', request: 'Request',
    youAre: 'You are ', change: ' · change', enterName: 'Please enter your name.', searching: 'Searching…',
    nothing: 'Nothing found.', scanning: ' (the PS5 is still reading the drive)',
    showing: (n, t) => `Showing ${n} of ${t}: refine your search.`,
    searchFail: "Couldn't search. Check the connection to the PS5.", requested: 'Requested: ',
    yourTurnBig: 'Your turn!', enjoy: 'Have a great performance 🎤', noSongsBig: 'No songs of yours in the queue',
    noSongsHint: 'Search for a song and request it in the Search tab.', nextYou: "You're next!",
    left: (n) => `${n} song${n === 1 ? '' : 's'} to go`, untilTurn: 'until your turn', empty: 'Empty.',
    keyWord: 'key ', queueEmpty: 'The queue is empty.', singing: 'Singing: ', next: 'Next: ', you: 'YOU',
    cancelAsk: (t) => `Cancel "${t}"?`, cancelled: 'Song cancelled.', finishAsk: 'Finish your song now?',
    genericErr: 'Something went wrong, try again.',
  },
  pt: {
    tagline: 'Peça músicas para cantar na TV.', namePh: 'Seu nome', enter: 'Entrar',
    offline: 'Sem conexão com o PS5. Tentando de novo…', yourTurnNow: 'É a sua vez! Cantando agora',
    key: 'Tom', original: 'Original', keyOriginal: 'Tom original', finish: 'Terminar',
    searchTitle: 'Buscar música', searchPh: 'Artista, música ou código', searchBtn: 'Buscar',
    fAll: 'Todas', fCdg: 'Só CDG', fMp4: 'Só vídeo (MP4)', srcUsb: 'HD/pen drive',
    ytNote: 'Os vídeos do YouTube tocam no navegador do PS5.', mySongs: 'Minhas músicas', rotation: 'Rotação',
    tabSearch: 'Buscar', tabMine: 'Minha vez', confirmAsk: 'Pedir esta música?', cancel: 'Cancelar', request: 'Pedir',
    youAre: 'Você é ', change: ' · trocar', enterName: 'Digite o seu nome.', searching: 'Buscando…',
    nothing: 'Nada encontrado.', scanning: ' (o PS5 ainda está lendo o HD)',
    showing: (n, t) => `Mostrando ${n} de ${t}: refine a busca.`,
    searchFail: 'Não consegui buscar. Verifique a conexão com o PS5.', requested: 'Pedido feito: ',
    yourTurnBig: 'Sua vez!', enjoy: 'Boa apresentação 🎤', noSongsBig: 'Nenhuma música sua na fila',
    noSongsHint: 'Busque uma música e peça na aba Buscar.', nextYou: 'Você é o próximo!',
    left: (n) => `Faltam ${n} música${n === 1 ? '' : 's'}`, untilTurn: 'para a sua vez', empty: 'Vazia.',
    keyWord: 'tom ', queueEmpty: 'A fila está vazia.', singing: 'Cantando: ', next: 'Próxima: ', you: 'VOCÊ',
    cancelAsk: (t) => `Cancelar "${t}"?`, cancelled: 'Música cancelada.', finishAsk: 'Terminar a sua música agora?',
    genericErr: 'Não deu certo, tente de novo.',
  },
};

/* Escolha do celular (bandeira) > idioma da TV > idioma do celular. */
let chosenLang = store.get('pk_lang');
let lang = chosenLang || ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en');
const t = (key) => I18N[lang][key];

function applyLang() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  if (myName) showWho();
  render();
}

document.querySelectorAll('[data-lang]').forEach((b) => {
  b.onclick = () => {
    lang = chosenLang = b.dataset.lang;
    store.set('pk_lang', lang);
    applyLang();
  };
});

let state = null;
let filter = 0;
let source = 'usb'; // 'usb' (HD/pen drive) ou 'yt' (YouTube)
let pending = null; // música aguardando confirmação

function toast(text, error) {
  const box = $('toast');
  box.textContent = text;
  box.className = 'toast' + (error ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.classList.add('hidden'), 2800);
}

async function api(method, path, params) {
  const qs = new URLSearchParams({ client, ...(params || {}) });
  const res = await fetch(path + '?' + qs.toString(), { method, cache: 'no-store' });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(body.error || t('genericErr'));
  return body;
}

function line(song) { return [song.artist, song.title].filter(Boolean).join(' – '); }
function pitchText(st) { return st ? (st > 0 ? '+' + st : String(st)) : t('original'); }

/* ---------- Telas ---------- */

function showWelcome() {
  $('welcome').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('name-input').value = myName;
  setTimeout(() => $('name-input').focus(), 50);
}

function showWho() {
  $('who').innerHTML = '';
  $('who').append(t('youAre'));
  const b = document.createElement('b');
  b.textContent = myName;
  $('who').append(b, t('change'));
}

function showApp() {
  $('welcome').classList.add('hidden');
  $('app').classList.remove('hidden');
  showWho();
}

$('name-ok').onclick = () => {
  const name = $('name-input').value.trim();
  if (!name) { toast(t('enterName'), true); return; }
  myName = name;
  store.set('pk_name', name);
  showApp();
};
$('name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('name-ok').click(); });
$('who').onclick = showWelcome;

function setTab(which) {
  $('tab-search').classList.toggle('hidden', which !== 'search');
  $('tab-mine').classList.toggle('hidden', which !== 'mine');
  $('tab-btn-search').classList.toggle('on', which === 'search');
  $('tab-btn-mine').classList.toggle('on', which === 'mine');
}
$('tab-btn-search').onclick = () => setTab('search');
$('tab-btn-mine').onclick = () => setTab('mine');

/* ---------- Busca ---------- */

document.querySelectorAll('[data-filter]').forEach((chip) => {
  chip.onclick = () => {
    filter = Number(chip.dataset.filter);
    document.querySelectorAll('[data-filter]').forEach((c) => c.classList.toggle('on', c === chip));
    if ($('q').value.trim()) search();
  };
});

document.querySelectorAll('[data-src]').forEach((chip) => {
  chip.onclick = () => {
    source = chip.dataset.src;
    document.querySelectorAll('[data-src]').forEach((c) => c.classList.toggle('on', c === chip));
    $('filters').classList.toggle('hidden', source === 'yt');
    $('results').innerHTML = '';
    $('search-msg').textContent = source === 'yt' ? t('ytNote') : '';
    if ($('q').value.trim()) search();
  };
});

$('search-form').onsubmit = (e) => { e.preventDefault(); $('q').blur(); search(); };

async function search() {
  const q = $('q').value.trim();
  const list = $('results');
  list.innerHTML = '';
  if (!q) { $('search-msg').textContent = ''; return; }
  $('search-msg').textContent = t('searching');
  try {
    const params = source === 'yt' ? { q, src: 'yt' } : { q, f: filter };
    const res = await fetch('/api/search?' + new URLSearchParams(params), { cache: 'no-store' });
    const body = await res.json();
    if (body.error) { $('search-msg').textContent = body.error; return; }
    const n = body.results.length;
    $('search-msg').textContent = n === 0 ? t('nothing') + (body.scanning ? t('scanning') : '')
      : body.total > n ? t('showing')(n, body.total) : '';
    for (const song of body.results) {
      const li = document.createElement('li');
      li.className = 'item';
      const info = document.createElement('div');
      info.className = 'info';
      const title = document.createElement('div');
      title.className = 't';
      title.textContent = song.title;
      const a = document.createElement('div');
      a.className = 'a';
      a.textContent = [song.artist, song.code].filter(Boolean).join(' · ');
      info.append(title, a);
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = song.format;
      li.append(info, tag);
      li.onclick = () => confirmSong(song);
      list.append(li);
    }
  } catch (e) {
    $('search-msg').textContent = t('searchFail');
  }
}

function confirmSong(song) {
  pending = song;
  $('sheet-title').textContent = song.title;
  $('sheet-artist').textContent = [song.artist, song.code, song.format].filter(Boolean).join(' · ');
  $('sheet').classList.remove('hidden');
}
$('sheet-cancel').onclick = () => $('sheet').classList.add('hidden');
$('sheet').onclick = (e) => { if (e.target === $('sheet')) $('sheet').classList.add('hidden'); };
$('sheet-ok').onclick = async () => {
  const song = pending;
  $('sheet').classList.add('hidden');
  if (!song) return;
  try {
    const req = { name: myName, path: song.path };
    if (song.video) req.title = song.video; // YouTube: título do vídeo
    await api('POST', '/api/queue', req);
    toast(t('requested') + song.title);
    poll();
  } catch (e) {
    toast(e.message, true);
  }
};

/* ---------- Estado (consulta a cada 1 s) ---------- */

function mySinger() {
  return state ? state.rotation.find((s) => s.c === myTag) : null;
}

/* Quantas músicas tocam antes da próxima minha (1 por cantor, na rotação). */
function songsBeforeMe() {
  const rot = state.rotation;
  let count = 0;
  for (let i = 0; i < rot.length; i++) {
    const s = rot[i];
    let songs = s.songs.length;
    if (i === 0 && state.now) songs -= 1; // a que está tocando já não conta
    if (s.c === myTag) return songs > 0 ? count : -1;
    if (songs > 0) count++;
  }
  return -1;
}

function render() {
  if (!state) return;
  const me = mySinger();
  const singingNow = state.now && state.now.c === myTag;

  /* Cantando agora */
  $('singing').classList.toggle('hidden', !singingNow);
  if (singingNow) {
    $('singing-title').textContent = state.now.song.title;
    $('singing-artist').textContent = state.now.song.artist;
    $('singing-pitch').textContent = pitchText(state.now.song.semitones);
  }

  /* Minha vez */
  const turn = $('turn');
  const mineSongs = me ? me.songs.filter((s) => !(state.now && s.id === state.now.song.id)) : [];
  if (singingNow) {
    turn.innerHTML = `<div class="big">${t('yourTurnBig')}</div><div class="muted">${t('enjoy')}</div>`;
  } else if (!mineSongs.length) {
    turn.innerHTML = `<div class="big">${t('noSongsBig')}</div><div class="muted">${t('noSongsHint')}</div>`;
  } else {
    const n = songsBeforeMe();
    turn.innerHTML = n === 0 ? `<div class="big">${t('nextYou')}</div>`
      : `<div class="big">${t('left')(n)}</div><div class="muted">${t('untilTurn')}</div>`;
  }
  $('mine-count').textContent = mineSongs.length;
  $('mine-count').classList.toggle('hidden', !mineSongs.length);

  const mine = $('mine');
  mine.innerHTML = '';
  if (!mineSongs.length) mine.innerHTML = `<li class="item muted">${t('empty')}</li>`;
  mineSongs.forEach((song, i) => {
    const li = document.createElement('li');
    li.className = 'item';
    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 't';
    title.textContent = (i + 1) + '. ' + song.title;
    const a = document.createElement('div');
    a.className = 'a';
    a.textContent = [song.artist, t('keyWord') + pitchText(song.semitones)].filter(Boolean).join(' · ');
    info.append(title, a);
    const down = document.createElement('button');
    down.className = 'mini';
    down.textContent = '−';
    down.onclick = () => setPitch(song, song.semitones - 1);
    const up = document.createElement('button');
    up.className = 'mini';
    up.textContent = '+';
    up.onclick = () => setPitch(song, song.semitones + 1);
    const x = document.createElement('button');
    x.className = 'mini x';
    x.textContent = t('cancel');
    x.onclick = () => cancelSong(song);
    li.append(info, down, up, x);
    mine.append(li);
  });

  /* Rotação geral */
  const rot = $('rotation');
  rot.innerHTML = '';
  const active = state.rotation.filter((s) => s.songs.length);
  if (!active.length) rot.innerHTML = `<li class="item muted">${t('queueEmpty')}</li>`;
  active.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'item';
    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 't';
    title.textContent = s.name;
    const playing = i === 0 && state.now && s.songs[0].id === state.now.song.id;
    const a = document.createElement('div');
    a.className = 'a';
    a.textContent = (playing ? t('singing') : t('next')) + line(s.songs[0]);
    info.append(title, a);
    li.append(info);
    if (s.c === myTag) {
      const tag = document.createElement('span');
      tag.className = 'tag mine';
      tag.textContent = t('you');
      li.append(tag);
    }
    rot.append(li);
  });
}

async function setPitch(song, st) {
  st = Math.max(-12, Math.min(12, st));
  try {
    await api('POST', '/api/pitch', { id: song.id, semitones: st });
    poll();
  } catch (e) { toast(e.message, true); }
}

async function cancelSong(song) {
  if (!confirm(t('cancelAsk')(song.title))) return;
  try {
    await api('POST', '/api/cancel', { id: song.id });
    toast(t('cancelled'));
    poll();
  } catch (e) { toast(e.message, true); }
}

document.querySelectorAll('[data-pitch]').forEach((b) => {
  b.onclick = () => state && state.now && setPitch(state.now.song, state.now.song.semitones + Number(b.dataset.pitch));
});
$('pitch-reset').onclick = () => state && state.now && setPitch(state.now.song, 0);
$('finish').onclick = async () => {
  if (!confirm(t('finishAsk'))) return;
  try { await api('POST', '/api/finish'); poll(); } catch (e) { toast(e.message, true); }
};

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    state = await res.json();
    $('offline').classList.add('hidden');
    /* Sem escolha no celular, segue o idioma da TV. */
    if (!chosenLang && state.lang && state.lang !== lang) { lang = state.lang; applyLang(); }
    render();
  } catch (e) {
    $('offline').classList.remove('hidden');
  }
}

if (myName) showApp(); else showWelcome();
applyLang();
poll();
/* Links prontos: ?tab=mine abre "Minha vez"; ?q= já faz a busca. */
if (params.get('tab') === 'mine') setTab('mine');
if (params.get('q')) { $('q').value = params.get('q'); search(); }
setInterval(poll, 1000);
</script>
</body>
</html>
