<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PlayKaraoke · YouTube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
  #player { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15, 12, 23, .94); text-align: center; padding: 6vh 8vw; }
  .msg h1 { font-size: 6vh; margin: 0 0 2vh; }
  .msg p { font-size: 3vh; color: #ddd6ea; margin: 0 0 1.5vh; }
  .msg .o { color: #ff666e; font-weight: bold; }
  .hidden { display: none; }
  #start { cursor: pointer; background: rgba(15, 12, 23, .78); }
  #start .play { width: 16vh; height: 16vh; border-radius: 50%; background: #b000e0; display: flex;
    align-items: center; justify-content: center; margin-bottom: 4vh; box-shadow: 0 0 0 1.2vh rgba(176, 0, 224, .3); }
  #start .play::after { content: ''; border-left: 5vh solid #fff; border-top: 3vh solid transparent;
    border-bottom: 3vh solid transparent; margin-left: 1.2vh; }
  #start .x { color: #7cb2e8; font-weight: bold; }
  .btn { display: inline-block; background: #b000e0; color: #fff; text-decoration: none; font-size: 3vh;
    padding: 1.6vh 4vh; border-radius: 2vh; margin: 2vh 0; }
  #error-code { color: #7d7590; font-size: 2.2vh; }
</style>
</head>
<body>
<!-- O player do YouTube é embutido nesta página (servida pelo PS5) porque o
     YouTube recusa o player aberto sem uma página de origem (erro 153). -->
<div id="player"></div>
<!-- Os navegadores só deixam o vídeo começar sozinho sem som: um toque (✕
     no PS5) libera o som. A tela inteira é o botão. -->
<div id="start" class="msg"><div class="play"></div><h1 data-t="start"></h1><p data-t="startHint"></p></div>
<div id="ended" class="msg hidden"><h1 data-t="ended"></h1><p data-t="back"></p></div>
<div id="error" class="msg hidden"><h1 data-t="error"></h1><p data-t="errorHint"></p><p id="error-code"></p>
  <p><a id="watch" class="btn" data-t="watch"></a></p><p data-t="back"></p></div>

<script>
'use strict';
const T = {
  en: { start: 'Press ✕ to start', startHint: 'The song plays with sound after you press it.',
        ended: 'Song finished!', back: 'Press ○ to close the browser and go back to PlayKaraoke.',
        error: "This video can't be played here.", errorHint: 'YouTube refused to play it inside PlayKaraoke. Pick another video or open it on youtube.com.',
        watch: 'Open on youtube.com' },
  pt: { start: 'Aperte ✕ para começar', startHint: 'A música toca com som depois do toque.',
        ended: 'Música terminou!', back: 'Aperte ○ para fechar o navegador e voltar ao PlayKaraoke.',
        error: 'Este vídeo não pode tocar aqui.', errorHint: 'O YouTube não deixou tocar dentro do PlayKaraoke. Escolha outro vídeo ou abra no youtube.com.',
        watch: 'Abrir no youtube.com' },
};
const videoId = new URLSearchParams(location.search).get('v') || '';
let lang = 'en';

function applyLang() {
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
}
fetch('/api/state', { cache: 'no-store' }).then((r) => r.json())
  .then((s) => { if (s.lang === 'pt') lang = 'pt'; applyLang(); }).catch(applyLang);

function show(id) { document.getElementById(id).classList.remove('hidden'); }

/* Registra no log do app (PS5) o que aconteceu no player, para diagnóstico. */
function report(what) {
  fetch('/api/ytlog?' + new URLSearchParams({ v: videoId, e: what }), { method: 'POST' }).catch(() => {});
}
document.getElementById('watch').href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(videoId);

let player = null;
let ready = false;

/* O play tem que acontecer dentro do toque (senão o navegador deixa mudo):
 * antes de o player ficar pronto, o toque não faz nada. */
function startWithSound() {
  if (!ready) return;
  document.getElementById('start').classList.add('hidden');
  player.unMute();
  player.setVolume(100);
  player.playVideo();
  setTimeout(() => report('playing muted=' + player.isMuted() + ' volume=' + player.getVolume() +
                          ' state=' + player.getPlayerState()), 3000);
}
document.getElementById('start').addEventListener('click', startWithSound);
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') startWithSound(); });

/* API do player do YouTube: avisa quando o vídeo acaba ou dá erro. */
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    videoId,
    width: '100%', height: '100%',
    playerVars: { autoplay: 0, rel: 0, fs: 1, playsinline: 1, origin: location.origin },
    events: {
      onReady: () => { ready = true; report('ready'); },
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) show('ended'); },
      onError: (e) => {
        document.getElementById('error-code').textContent = 'YouTube error ' + e.data;
        report('error ' + e.data);
        show('error');
      },
    },
  });
};
const api = document.createElement('script');
api.src = 'https://www.youtube.com/iframe_api';
api.onerror = () => show('error');
document.head.append(api);
</script>
</body>
</html>
