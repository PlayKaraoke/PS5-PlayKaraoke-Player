<svg xmlns="http://www.w3.org/2000/svg" width="704" height="48" viewBox="0 0 704 48">
  <style>
    .t-dark { font-family: -apple-system, Inter, Helvetica, Arial, sans-serif; font-weight: 700; fill: #0F0F1C; text-anchor: middle; dominant-baseline: central; }
    .t-light { font-family: -apple-system, Inter, Helvetica, Arial, sans-serif; font-weight: 700; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- 0: CROSS (center 32, 24) -->
  <g transform="translate(32, 24)">
    <circle r="17" fill="none" stroke="#8B9CF6" stroke-width="2.2"/>
    <path d="M-7,-7 L7,7 M-7,7 L7,-7" stroke="#8B9CF6" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 1: CIRCLE (center 96, 24) -->
  <g transform="translate(96, 24)">
    <circle r="17" fill="none" stroke="#F05A5A" stroke-width="2.2"/>
    <circle r="8.5" fill="none" stroke="#F05A5A" stroke-width="2.6"/>
  </g>

  <!-- 2: TRIANGLE (center 160, 24) -->
  <g transform="translate(160, 24)">
    <circle r="17" fill="none" stroke="#2DD4BF" stroke-width="2.2"/>
    <polygon points="0,-9 -8.5,6.5 8.5,6.5" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- 3: SQUARE (center 224, 24) -->
  <g transform="translate(224, 24)">
    <circle r="17" fill="none" stroke="#F472B6" stroke-width="2.2"/>
    <rect x="-7.5" y="-7.5" width="15" height="15" rx="1.5" fill="none" stroke="#F472B6" stroke-width="2.5"/>
  </g>

  <!-- 4: DPAD (center 288, 24) -->
  <g transform="translate(288, 24)">
    <rect x="-5" y="-14" width="10" height="28" rx="2.5" fill="#CBD5E1"/>
    <rect x="-14" y="-5" width="28" height="10" rx="2.5" fill="#CBD5E1"/>
    <circle r="3" fill="#0F0F1C"/>
  </g>

  <!-- 5: L1 (center 352, 24) -->
  <g transform="translate(352, 24)">
    <rect x="-21" y="-13" width="42" height="26" rx="8" fill="#CBD5E1"/>
    <text y="0.5" font-size="14" class="t-dark">L1</text>
  </g>

  <!-- 6: R1 (center 416, 24) -->
  <g transform="translate(416, 24)">
    <rect x="-21" y="-13" width="42" height="26" rx="8" fill="#CBD5E1"/>
    <text y="0.5" font-size="14" class="t-dark">R1</text>
  </g>

  <!-- 7: L1 R1 (center 480, 24) -->
  <g transform="translate(480, 24)">
    <rect x="-28" y="-13" width="56" height="26" rx="7" fill="#CBD5E1"/>
    <text y="0.5" font-size="12" class="t-dark">L1 R1</text>
  </g>

  <!-- 8: RSTICK (center 544, 24) -->
  <g transform="translate(544, 24)">
    <circle r="13" fill="none" stroke="#CBD5E1" stroke-width="2.2"/>
    <text y="0.5" font-size="14" class="t-light">R</text>
    <polygon points="-24,0 -17,-5 -17,5" fill="#CBD5E1"/>
    <polygon points="24,0 17,-5 17,5" fill="#CBD5E1"/>
  </g>

  <!-- 9: OPTIONS (center 608, 24) -->
  <g transform="translate(608, 24)">
    <text y="-12" font-size="9" class="t-light">OPTIONS</text>
    <rect x="-4.5" y="-3" width="9" height="18" rx="4.5" fill="#CBD5E1"/>
  </g>

  <!-- 10: TOUCHPAD (center 672, 24) -->
  <g transform="translate(672, 24)">
    <rect x="-21" y="-13" width="42" height="26" rx="4" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="-12" cy="-5" r="1.3" fill="#CBD5E1"/><circle cx="-4" cy="-5" r="1.3" fill="#CBD5E1"/><circle cx="4" cy="-5" r="1.3" fill="#CBD5E1"/><circle cx="12" cy="-5" r="1.3" fill="#CBD5E1"/>
    <circle cx="-12" cy="0" r="1.3" fill="#CBD5E1"/><circle cx="-4" cy="0" r="1.3" fill="#CBD5E1"/><circle cx="4" cy="0" r="1.3" fill="#CBD5E1"/><circle cx="12" cy="0" r="1.3" fill="#CBD5E1"/>
    <circle cx="-12" cy="5" r="1.3" fill="#CBD5E1"/><circle cx="-4" cy="5" r="1.3" fill="#CBD5E1"/><circle cx="4" cy="5" r="1.3" fill="#CBD5E1"/><circle cx="12" cy="5" r="1.3" fill="#CBD5E1"/>
  </g>
</svg>
